; Projeto PlatformIO - piloto de monitoramento de bomba (ESP32 + ADS1115 + SCT-013)
; Ainda não compilado: as bibliotecas e a versão do framework devem ser confirmadas na primeira compilação.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit ADS1X15 @ ^2.5.0
    bblanchon/ArduinoJson @ ^7.0.0
