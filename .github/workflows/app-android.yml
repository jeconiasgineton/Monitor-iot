name: App Android

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/app-android.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar projeto Android e copiar o código do app
        run: |
          flutter create --platforms=android --project-name monitor_iot_app --org br.com.fielsoft /tmp/monitor_app
          rm -rf /tmp/monitor_app/lib /tmp/monitor_app/test
          cp -r app/lib app/pubspec.yaml /tmp/monitor_app/

      - name: Dependências e análise
        working-directory: /tmp/monitor_app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Gerar APK de teste
        working-directory: /tmp/monitor_app
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: monitor-iot-app-debug
          path: /tmp/monitor_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
